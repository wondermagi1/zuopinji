<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gxr 的前端网页作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>gxr 的前端网页作品集</h1>
            <p>这是我的前端网页作品，点击卡片跳转到具体页面！</p>
        </header>

        <main class="projects-grid" aria-label="网页作品">
            <a class="project-card" href="https://quiz-one-rho-13.vercel.app/" target="_blank" rel="noopener noreferrer">
                <div class="project-preview">
                    <img src="img/quiz.png" alt="Quiz Time 页面预览">
                </div>
                <div class="project-info">
                    <h2>Quiz Time</h2>
                    <span class="project-tag">Quiz</span>
                </div>
            </a>

            <a class="project-card" href="https://newform-psi.vercel.app/" target="_blank" rel="noopener noreferrer">
                <div class="project-preview">
                    <img src="img/register.png" alt="Register Form 页面预览">
                </div>
                <div class="project-info">
                    <h2>Register Form</h2>
                    <span class="project-tag">Register</span>
                </div>
            </a>

            <a class="project-card" href="https://recipe-finder-ashen-nu.vercel.app/" target="_blank" rel="noopener noreferrer">
                <div class="project-preview">
                    <img src="img/recipe.png" alt="Recipe Finder 页面预览">
                </div>
                <div class="project-info">
                    <h2>Recipe Finder</h2>
                    <span class="project-tag">Recipe</span>
                </div>
            </a>
        </main>
    </div>
</body>
</html>
